name: Stock Price Alert

on:
  schedule:
    # 30분마다 자동으로 실행 (원하시면 시간 간격을 수정할 수 있습니다)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 깃허브 웹사이트에서 수동으로 테스트 실행할 수 있는 버튼 활성화

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run Price Alert Script
        env:
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
        run: |
          python price_alert.py

      - name: Commit state file if changed
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update alerted state"
          file_pattern: "alerted_today.json"
